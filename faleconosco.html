<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto Web</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="bg-gray-300">
    <div class="w-full mx-auto container bg-white">
      <!-- inicio cabeçalho -->
      <div class="w-full p-4 flex bg-blue-900 text-white">
        <div class="w-3/12">
          <img src="imagens/spotify-real.png" alt="spotify" class="w-50" />
        </div>
        <div class="w-9/12">
          <div class="w-full h-full flex justify-end items-center gap-5 pr-10">
            <div>
              <a
                class="p-5 rounded-xl hover:bg-sky-400 hover:text-white transition duration-300"
                href="index.html"
                >Home</a
              >
            </div>
            <div>
              <a
                class="p-5 rounded-xl hover:bg-sky-400 hover:text-white transition duration-300"
                href="quemsomos.html"
                >Quem somos</a
              >
            </div>
            <div>
              <a
                class="p-5 rounded-xl hover:bg-sky-400 hover:text-white transition duration-300"
                href="faleconosco.html"
                >Fale conosco</a
              >
            </div>
          </div>
        </div>
      </div>
      <!-- fim cabeçalho -->

      <!-- inicio conteudo -->
      <div class="w-full p-4 flex gap-2 bg-gray-100">
        <!-- começo contato -->

        <div
          class="w-1/2 flex flex-col p-4 gap bg-gray-400 shadow-[0_0_5px_black] rounded-lg"
        >
          <h1
            class="font-bold text-white text-3xl shadow-[0_0_5px_black] rounded-lg mb-6"
          >
            Contato
          </h1>

          <p class="text-lg mb-4">
            <i class="bi bi-telephone"></i> (12) 12345-6789
          </p>

          <p class="text-lg mb-4">
            <i class="bi bi-whatsapp"></i> (12) 13131313113
          </p>

          <p class="text-lg mb-4">
            <i class="bi bi-envelope"></i> contato@site.com.br
          </p>

          <p class="text-lg mb-4">
            <i class="bi bi-geo-alt"></i> Rua alguma coisa, 1015 - Taubaté / SP
          </p>
        </div>

        <!-- fim contato -->

        <!-- inicio fale conosco -->

        <div
          class="w-1/2 flex flex-col p-4 gap bg-gray-400 shadow-[0_0_5px_black] rounded-lg"
        >
          <h1
            class="font-bold text-center text-white text-3xl shadow-[0_0_5px_black] rounded-lg mb-6"
          >
            Fale conosco
          </h1>

          <div class="w-full flex gap-4">
            <form class="w-full">
              <div class="mb-4 w-3/4 flex items-center gap-2">
                <label class="text-gray-700 font-bold">Nome: </label>
                <input
                  type="text"
                  class="w-full p-2 border border-gray-300 rounded-lg"
                  placeholder="Digite seu nome"
                />
              </div>

              <div class="w-3/4 flex gap-4">
                <div class="w-full mb-4 flex items-center gap-2">
                  <label class="text-gray-700 font-bold">Telefone: </label>
                  <input
                    type="text"
                    class="w-full p-2 border border-gray-300 rounded-lg"
                    placeholder="Digite seu telefone"
                  >
                  </input>
                </div>
              </div>
              <div class="w-full mb-4 flex items-center gap-2">
                <label class="text-gray-700 font-bold">Email: </label>
                <input
                  type="email"
                  class="w-full p-2 border border-gray-300 rounded-lg"
                  placeholder="Digite seu email"
                >
                </input>
              </div>

              <div
                class="w-3/4 mb-4 flex flex-col justify-center items-start gap-2"
              >
                <label class="text-gray-700 font-bold min-24">Mensagem: </label>
                <textarea
                  rows="5"
                  class="w-full p-2 border border-gray-300 rounded-lg"
                  placeholder="Digite sua mensagem"
                ></textarea>
              </div>

               <div class="w-full">
                <button class="bg-red-600 text-white py-2 px-4 rounded-lg 
                hover:bg-red-700 transition cursor-pointer duration-300">
                Enviar <i class="bi bi-send"></i>
                </button>
               </div>

            </form>

          </div>

          <!-- fim fale conosco -->
        </div>
      </div>
      <!-- google maps -->
       <div class="w-full p-4">
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12349.9801870287!2d-45.56306130929247!3d-23.035846285619083!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ccf91e696b7da7%3A0x531b7ec4bff84e66!2sSenac%20Taubat%C3%A9!5e0!3m2!1spt-BR!2sbr!4v1779449966706!5m2!1spt-BR!2sbr" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
         </div>

      <!-- começo rodapé -->
      <div class="w-full flex bg-blue-900 text-white p-4">
        <div class="w-1/3">
          <img src="imagens/spotify-real.png" alt="spotify" class="w-40" />
        </div>
        <div class="w-2/3">
          <div class="w-2/3 gap-4 flex">
            <div class="w-1/2 flex flex-col items-end gap-2">
              <div>
                <a
                  class="p-2 rounded-xl hover:bg-sky-400 hover:text-white transition duration-300"
                  href="index.html"
                  >Home</a
                >
              </div>
              <div>
                <a
                  class="p-2 rounded-xl hover:bg-sky-400 hover:text-white transition duration-300"
                  href="quemsomos.html"
                  >Quem somos</a
                >
              </div>
              <div>
                <a
                  class="p-2 rounded-xl hover:bg-sky-400 hover:text-white transition duration-300"
                  href="faleconosco.html"
                  >Fale conosco</a
                >
              </div>
            </div>
            <div class="w-1/2 flex flex-col items-end gap-2">
              <div>
                <h4 class="text-lg font-bold">Redes Sociais</h4>
              </div>
              <div class="flex gap-2">
                <div>
                  <a href=""><i class="bi bi-facebook"></i></a>
                </div>
                <div>
                  <a href=""><i class="bi bi-instagram"></i></a>
                </div>
                <div>
                  <a href=""><i class="bi bi-youtube"></i></a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- fim rodapé -->
    </div>
  </body>
</html>
